<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Rapport communal · Ressources aquatiques</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f7f5ef; --panel:#ffffff; --ink:#2b333a; --ink2:#363F47; --muted:#5c6b66; --line:#e6e0cf;
  --accent:#4a7c59; --accent2:#3d6a4b; --soft:#eef3ea; --soft2:#faf8f2; --warn:#9a6a00; --warn-bg:#fdf3dc;
  --serif:Georgia,'Iowan Old Style',serif; --shadow:0 2px 12px rgba(15,48,42,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f1715; --panel:#17211e; --ink:#e3eeea; --ink2:#bfd0ca; --muted:#8fa49c; --line:#2a3834; --soft:#1d2d29; --soft2:#14201d; --accent:#2fb39d; --accent2:#5fd0bc; --warn:#f0c560; --warn-bg:#3a2f12; --shadow:0 2px 12px rgba(0,0,0,.45); }
}
:root[data-theme="dark"]{ --bg:#0f1715; --panel:#17211e; --ink:#e3eeea; --ink2:#bfd0ca; --muted:#8fa49c; --line:#2a3834; --soft:#1d2d29; --soft2:#14201d; --accent:#2fb39d; --accent2:#5fd0bc; --warn:#f0c560; --warn-bg:#3a2f12; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px}
header .in{max-width:900px;margin:0 auto;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header b{font-family:var(--serif);font-size:20px;color:var(--accent)} header span{color:var(--muted)}
main{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:var(--serif);font-weight:normal;font-size:30px;line-height:1.2;margin:8px 0 4px;color:var(--ink2)}
h2{font-family:var(--serif);font-weight:normal;font-size:21px;margin:0 0 10px;color:var(--ink2)}
.muted{color:var(--muted)} .small{font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin:16px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--soft2);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:28px;color:var(--ink2);font-family:var(--serif)} .kpi span{font-size:14px;color:var(--muted)}
.kpi.main{background:var(--soft);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:15px} th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top} th{color:var(--ink2)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:15px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);margin:10px 0 6px}
.bar i{display:block;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)} .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
footer{max-width:900px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;font-weight:600}
#carte{height:520px;border-radius:10px;border:1px solid var(--line);margin-top:10px}
.lbl{background:#fff;border:2px solid #2e7d4f;border-radius:50%;width:24px;height:24px;line-height:20px;text-align:center;font:700 11px/20px system-ui,sans-serif;color:#1d3b2a;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.lbl.public_probable{border-color:#7fb38f}.lbl.technique{border-color:#2f80c9;color:#1b4a75}.lbl.a_confirmer{border-color:#a39d88;color:#555}.lbl.att{background:#ffd400;border-color:#a8321f;color:#000}
.num{display:inline-block;min-width:24px;height:24px;border-radius:50%;text-align:center;line-height:20px;font-weight:700;font-size:12px;border:2px solid #2e7d4f;background:#fff;color:#1d3b2a}
.num.public_probable{border-color:#7fb38f}.num.technique{border-color:#2f80c9}.num.a_confirmer{border-color:#a39d88}.num.att{background:#ffd400;border-color:#a8321f;color:#000}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:8px}
.vig{position:relative;border-radius:8px;overflow:hidden;background:var(--soft);aspect-ratio:1/1}
.vig img{width:100%;height:100%;object-fit:cover;display:block}
.vig svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vig span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px}
.tw{overflow-x:auto}
.contact{border-color:var(--accent);background:var(--soft)}
.contact .acts{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.contact .who{line-height:1.5}
.btn.big{font-size:17px;padding:13px 20px}
.btn.alt{background:var(--panel);color:var(--accent);border:2px solid var(--accent)}
.fab{position:fixed;right:16px;bottom:16px;z-index:1000;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 32px)}
.fab a{box-shadow:0 4px 16px rgba(0,0,0,.25)}
.mobile-only{display:none}
@media (max-width:700px), (pointer:coarse){ .mobile-only{display:inline-block} }
@media (max-width:480px){ .fab{left:16px;right:16px;justify-content:stretch} .fab a{flex:1;text-align:center} }
main{padding-bottom:96px}
@media print{#carte{height:420px}header,.noprint,.fab{display:none} body{background:#fff} .card{box-shadow:none}}
</style>
</head>
<body>
<header><div class="in"><b>Aquiklin</b><span>Observatoire des plans d'eau · Rapport communal</span></div></header>
<main id="app"><p class="muted">Chargement du rapport…</p></main>
<footer id="foot"></footer>
<script>
/* Page publique d'un rapport communal. Accès uniquement par lien (jeton après « # », jamais envoyé au serveur web).
   La base ne renvoie que le contenu figé du rapport publié, via la fonction oc_portail. */
const SB_URL = "https://dnunawdqljlvkhwvwxxa.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRudW5hd2RxbGpsdmtod3Z3eHhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2NzQ1MzgsImV4cCI6MjA5MjI1MDUzOH0.4m_Cm8T2OcGs43FX3aWu6ZvDUev_Y-qjxmWbSkvUaRQ";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "—" : Number(n).toLocaleString("fr-BE");
const dateFr = d => d ? new Date(d).toLocaleDateString("fr-BE", { day:"numeric", month:"long", year:"numeric" }) : "";
const app = document.getElementById("app");

const GEO = "https://geoservices.wallonie.be/arcgis/rest/services/";
const imgUrl = (svc, b) => `${GEO}IMAGERIE/ORTHO_${svc}/MapServer/export?bbox=${b.join(",")}&bboxSR=31370&imageSR=31370&size=300,300&format=jpg&transparent=false&f=image`;
const lblCamp = k => String(k).replace("_PRINTEMPS", " printemps").replace("_ETE", " été").replace(/^(\d{4})_(\d{4})$/, "$1-$2");
const catOf = statut => /établi/.test(statut) ? "" : /probable/.test(statut) ? "public_probable" : /technique/i.test(statut) ? "technique" : "a_confirmer";
function svgContour(im){ const b = im.boite, w = b[2]-b[0];
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${im.contour.map(r => `<polygon points="${r.map(([x,y]) => `${((x-b[0])/w*100).toFixed(1)},${((b[3]-y)/w*100).toFixed(1)}`).join(" ")}" fill="none" stroke="#ffd400" stroke-width=".8" stroke-dasharray="2 1.2"/>`).join("")}</svg>`; }
function initCarte(c){
  const el = document.getElementById("carte"); if(!el || !window.L) return;
  const map = L.map(el, { scrollWheelZoom: false });
  const ortho = L.tileLayer.wms("https://geoservices.wallonie.be/arcgis/services/IMAGERIE/ORTHO_LAST/MapServer/WMSServer", { layers: "0", format: "image/jpeg", maxZoom: 21, attribution: "© SPW – WalOnMap" });
  const plan = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap", referrerPolicy: "origin" });
  plan.addTo(map); L.control.layers({ "Plan": plan, "Photo aérienne": ortho }).addTo(map);
  const COL = { public_etabli: "#2e7d4f", public_probable: "#7fb38f", technique: "#2f80c9", a_confirmer: "#a39d88", prive: "#b9b29a" };
  const pts = [];
  c.carte.filter(p => p.cat === "prive").forEach(p => { L.circleMarker([p.lat, p.lon], { radius: 3.5, weight: 0, fillColor: COL.prive, fillOpacity: .85 }).bindTooltip("Pièce d'eau privée").addTo(map); pts.push([p.lat, p.lon]); });
  c.carte.filter(p => p.cat !== "prive").sort((a,b) => (b.n||0) - (a.n||0)).forEach(p => {
    const cls = p.attention ? "att" : p.cat;
    L.marker([p.lat, p.lon], { icon: L.divIcon({ className: "", html: `<div class="lbl ${cls}">${p.n ?? ""}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] }) })
      .bindTooltip(`N° ${p.n} · ≈ ${fmt(p.surface_m2)} m²`).addTo(map); pts.push([p.lat, p.lon]); });
  if(pts.length) map.fitBounds(pts, { padding: [24, 24], maxZoom: 16 });
}
function render(titre, version, publie_le, c, apercu){
  const k = c.compteurs || {}, total = Math.max(1, k.detectes || 0);
  const parts = [["Publics (établis)", k.publics_etablis, "#2e7d4f"], ["Publics probables (à confirmer)", k.probablement_publics, "#7fb38f"],
                 ["Privés", k.prives, "#b9b29a"], ["Infrastructures techniques", k.techniques, "#2f80c9"], ["Statut à confirmer", k.a_confirmer, "#d5d0c0"]];
  document.title = `${c.commune.nom} · Ressources aquatiques du territoire`;
  app.innerHTML = `
    ${apercu ? `<p class="note noprint">Aperçu interne : ce rapport n'est visible par la commune qu'au travers d'un lien unique.</p>` : ""}
    <p class="muted small">${esc(c.commune.province || "")}${publie_le ? " · rapport du " + dateFr(publie_le) : ""}${version ? " · version " + version : ""}</p>
    <h1>${esc(titre || ("Ressources aquatiques du territoire de " + c.commune.nom))}</h1>
    <p class="muted">Première lecture cartographique des pièces d'eau présentes sur le territoire communal.</p>

    <section class="card"><h2>Carte des pièces d'eau</h2>
      <p class="small muted">${fmt(k.detectes)} pièces d'eau identifiées sur le territoire. Les pièces d'eau publiques, techniques et à confirmer sont numérotées et reprises dans la liste ci-dessous ; les pièces d'eau privées sont seulement figurées (points gris).</p>
      ${(c.carte||[]).length ? `<div id="carte" role="img" aria-label="Carte des pièces d'eau de la commune"></div>` : `<p class="muted">Carte non disponible pour cette version du rapport.</p>`}
      <div class="leg" style="margin-top:8px">${[["#2e7d4f","Public (établi)",k.publics_etablis],["#7fb38f","Public probable (à confirmer)",k.probablement_publics],["#2f80c9","Infrastructure technique",k.techniques],["#a39d88","Statut à confirmer",k.a_confirmer],["#b9b29a","Privé",k.prives]].map(([col,l,v]) => `<span><i style="background:${col}"></i>${esc(l)} : ${fmt(v||0)}</span>`).join("")}${k.points_attention ? `<span><i style="background:#ffd400;border:1px solid #a8321f"></i>Point d'attention : ${fmt(k.points_attention)}</span>` : ""}</div>
      <div class="bar" role="img" aria-label="Répartition des pièces d'eau par statut">${parts.map(([l,v,col]) => v ? `<i style="width:${v/total*100}%;background:${col}" title="${esc(l)} : ${v}"></i>` : "").join("")}</div>
      <p class="small muted">Le statut public n'est indiqué comme « établi » que lorsqu'il est confirmé par une source. Aucune information sur les propriétaires privés n'est reprise.</p>
    </section>

    <section class="card"><h2>Liste des pièces d'eau publiques et techniques</h2>
      ${(c.liste||[]).length ? `<div class="tw"><table><thead><tr><th>N°</th><th>Lieu</th><th>Surface</th><th>Statut</th><th>Observation</th></tr></thead><tbody>${c.liste.map(x => `<tr>
          <td><span class="num ${x.attention ? "att" : esc(catOf(x.statut))}">${x.n}</span></td><td>${esc(x.lieu)}${x.localite && x.localite !== x.lieu ? `<div class="small muted">${esc(x.localite)}</div>` : ""}</td>
          <td>≈ ${fmt(x.surface_m2)} m²</td><td>${esc(x.statut)}${x.gestionnaire ? `<div class="small muted">${esc(x.gestionnaire)}</div>` : ""}</td><td>${esc(x.observation || "—")}</td></tr>`).join("")}</tbody></table></div>`
        : `<p class="muted">Aucune pièce d'eau publique ou technique identifiée à ce stade.</p>`}
      ${(c.points_attention||[]).length ? `<p class="small">Les numéros sur fond jaune signalent une couverture végétale flottante visible sur les images aériennes, qui pourrait mériter une observation complémentaire.</p>`
        : `<p class="small">Aucune situation particulière n'a été retenue à ce stade : ce rapport constitue un <b>état de référence</b> pour suivre l'évolution de ces ressources dans le temps.</p>`}
    </section>

    ${(c.images||[]).length ? `<section class="card"><h2>Images aériennes dans le temps</h2>
      <p class="small muted">Orthophotos du Service public de Wallonie, de la plus ancienne à la plus récente. Le contour de la pièce d'eau est tracé en jaune. L'aspect d'une image dépend de la saison de la prise de vue (printemps ou été).</p>
      ${c.images.map(im => `<div style="margin-top:16px"><div class="row" style="display:flex;gap:8px;align-items:center"><span class="num ${im.attention ? "att" : ""}">${im.n}</span><b>${esc(im.lieu)}</b><span class="small muted">≈ ${fmt(im.surface_m2)} m²</span></div>
        <div class="strip">${im.campagnes.map(cp => `<div class="vig"><img loading="lazy" alt="Orthophoto ${esc(lblCamp(cp))}" src="${imgUrl(cp, im.boite)}" onerror="this.parentNode.style.display='none'">${svgContour(im)}<span>${esc(lblCamp(cp))}</span></div>`).join("")}</div></div>`).join("")}
      <p class="small muted" style="margin-top:10px">Images : © Service public de Wallonie (WalOnMap). Une image absente signifie que la campagne ne couvre pas ce lieu.</p></section>` : ""}

    ${(c.references||[]).length ? `<section class="card"><h2>Contexte</h2>${c.references.map(r => `<p>${esc(r.formulation.charAt(0).toUpperCase() + r.formulation.slice(1))}. <span class="small muted">(<a href="${esc(r.url)}" target="_blank" rel="noopener">source</a>${r.date_publication ? ", " + dateFr(r.date_publication) : ""})</span></p>`).join("")}
      <p>Dans un contexte d'augmentation des températures, de sécheresses plus marquées et de fortes pluies, les mares, étangs, zones humides et bassins de rétention jouent un rôle croissant pour la biodiversité, la gestion de l'eau et la résilience du territoire.</p></section>` : ""}

    ${(c.engagements||[]).length ? `<section class="card"><h2>Engagements de la commune</h2><p class="small muted">Politiques publiques communales en lien avec l'eau, le climat ou la biodiversité, relevées sur des sources publiques :</p>
      <ul>${c.engagements.map(e => `<li>${esc(e.theme)} — <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.titre)}</a>${e.date_document ? ` <span class="small muted">(${esc(e.date_document)})</span>` : ""}</li>`).join("")}</ul></section>` : ""}

    <section class="card"><h2>Méthode et limites</h2>
      <p>Les pièces d'eau sont issues du référentiel cartographique du Service public de Wallonie. Leur aspect est lu sur les orthophotos successives du SPW (images aériennes datées), en tenant compte de la saison de chaque prise de vue. Le statut public ou privé provient des couches officielles de propriété ; il n'est considéré comme établi qu'après confirmation.</p>
      <p>Ce rapport constitue une première lecture cartographique du territoire. Il ne remplace pas une observation de terrain ni, lorsque cela s’avère nécessaire, une analyse de l’eau.</p>
      <p>${esc((c.mentions && c.mentions.sources) || "Les images aériennes et données cartographiques utilisées sont des données publiques mises à disposition par le Service public de Wallonie (Géoportail de la Wallonie). Leur analyse et leur interprétation sont réalisées par Aquiklin, sous sa seule responsabilité : ce rapport n’est ni produit, ni validé par la Région wallonne et ne constitue pas un contrôle officiel.")}</p>
      ${c.mentions && c.mentions.supervision ? `<p>${esc(c.mentions.supervision)}</p>` : ""}
      ${c.mentions && c.mentions.avertissement ? `<p><b>${esc(c.mentions.avertissement)}</b></p>` : ""}
    </section>

    ${blocContact(c)}`;
  initCarte(c);
  boutonFlottant(c);
  document.getElementById("foot").innerHTML = `${esc((c.signature && c.signature.nom) || "")} · ${esc((c.signature && c.signature.organisation) || "Aquiklin")} · Données publiques : © Service public de Wallonie (WalOnMap) · Analyse et interprétation : Aquiklin.`;
}

// ---- contact direct : mail prérempli (modifiable avant envoi), téléphone, appel sur mobile ----
function mailtoContact(ct, commune){
  return "mailto:" + encodeURIComponent(ct.email) + "?subject=" + encodeURIComponent(`Rapport Aquiklin – Commune de ${commune}`)
    + "&body=" + encodeURIComponent(`Bonjour Monsieur Despret,\n\nJ'ai consulté le rapport relatif aux ressources aquatiques de ${commune} et souhaiterais échanger avec vous à ce sujet.\n\nBien cordialement,\n`);
}
const telHref = t => "tel:" + String(t || "").replace(/[^+\d]/g, "");
function blocContact(c){
  const ct = c.contact, commune = c.commune.nom;
  if(!ct) return `<section class="card noprint" id="contact"><h2>Un échange ?</h2>
      <p>Si certaines observations retiennent votre attention, nous pouvons vous présenter notre méthode et examiner avec vous les pièces d'eau concernées. Cette première rencontre est gratuite et sans engagement.</p>
      <p><a class="btn" href="${esc((c.signature && c.signature.site) || "https://www.aquiklin.be")}" target="_blank" rel="noopener">Contacter Aquiklin</a></p></section>`;
  return `<section class="card contact" id="contact"><h2>Échanger avec nous sur ce rapport</h2>
      <p>Si certaines observations retiennent votre attention, nous serions heureux de vous présenter la méthode utilisée, de parcourir avec vous les résultats concernant ${esc(commune)} et d'examiner les pistes permettant de mieux connaître, préserver ou améliorer durablement la gestion de certaines pièces d'eau. Cette présentation et cette première rencontre sont proposées <b>gratuitement et sans engagement</b>.</p>
      <div class="acts noprint">
        ${ct.email ? `<a class="btn big" href="${esc(mailtoContact(ct, commune))}">Échanger avec nous sur ce rapport</a>` : ""}
        ${ct.telephone ? `<a class="btn big alt mobile-only" href="${esc(telHref(ct.telephone))}">Appeler ${esc(ct.nom)}</a>` : ""}
      </div>
      ${ct.email ? `<p class="small muted noprint">Le bouton ouvre votre messagerie avec un message déjà rédigé, que vous pouvez modifier avant de l'envoyer.</p>` : ""}
      <p class="who"><b>${esc(ct.nom)}</b><br>${esc(ct.organisation || "Aquiklin")}
        ${ct.telephone ? `<br><a href="${esc(telHref(ct.telephone))}">${esc(ct.telephone)}</a>` : ""}
        ${ct.email ? `<br><a href="mailto:${esc(ct.email)}">${esc(ct.email)}</a>` : ""}
        ${ct.site ? `<br><a href="${esc(ct.site)}" target="_blank" rel="noopener">${esc(ct.site.replace(/^https?:\/\//, ""))}</a>` : ""}</p>
      <p class="noprint"><button class="btn alt" style="cursor:pointer" onclick="window.print()">Imprimer / enregistrer en PDF</button></p>
    </section>`;
}
function boutonFlottant(c){
  const ct = c.contact; if(!ct || (!ct.email && !ct.telephone)) return;
  const old = document.querySelector(".fab"); if(old) old.remove();
  const d = document.createElement("div"); d.className = "fab";
  d.innerHTML = (ct.email ? `<a class="btn" href="${esc(mailtoContact(ct, c.commune.nom))}">Échanger avec nous</a>` : `<a class="btn" href="#contact">Nous contacter</a>`)
    + (ct.telephone ? `<a class="btn alt mobile-only" href="${esc(telHref(ct.telephone))}">Appeler</a>` : "");
  document.body.appendChild(d);
}

(async () => {
  const jeton = location.hash.replace(/^#/, "");
  if(jeton === "apercu"){
    try{ const a = JSON.parse(localStorage.getItem("oc-apercu-rapport") || "null"); if(a) return render(a.titre, a.version, a.publie_le, a.contenu, true); }catch(e){}
    app.innerHTML = `<div class="card">Aucun aperçu disponible.</div>`; return;
  }
  if(!/^[A-Za-z0-9_-]{40,100}$/.test(jeton)){ app.innerHTML = `<div class="card"><h2>Lien incomplet</h2><p>Ce lien ne permet pas d'afficher un rapport. Vérifiez qu'il a été copié en entier.</p></div>`; return; }
  try{
    const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
    const { data, error } = await sb.rpc("oc_portail", { p_jeton: jeton });
    if(error) throw error;
    if(!data || !data.ok){ app.innerHTML = `<div class="card"><h2>Rapport indisponible</h2><p>${esc((data && data.motif) || "Lien invalide")}. Pour obtenir un nouveau lien, répondez simplement au courriel reçu.</p></div>`; return; }
    render(data.rapport.titre, data.rapport.version, data.rapport.publie_le, data.rapport.contenu, false);
  }catch(e){ app.innerHTML = `<div class="card"><h2>Rapport momentanément indisponible</h2><p>Merci de réessayer dans quelques instants.</p></div>`; }
})();
</script>
</body>
</html>
